name: nostrfy Windows baseline
on:
  push:
    branches: [windows-port-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iqbqioza/nostrfy
          ref: 56640d89639394372e04103236ddba61a19b4ef2
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Check nostrfy on Windows
        run: cargo +stable check --locked --bins

{{- $name := "WeebDex" -}}
{{- $title := "WeebDex - High quality images. No ads." -}}
{{- $description := "WeebDex is an ad-free, scanlator-first online manga reader providing high-quality, zero-compression images." -}}

<title>{{ $title }}</title>

<link rel="preconnect" href="{{ .scheme }}//api.{{ .host }}" crossorigin="use-credentials" />
<link rel="dns-prefetch" href="{{ .scheme }}//api.{{ .host }}" />
<link rel="dns-prefetch" href="{{ .scheme }}//auth.{{ .host }}" />
<link rel="dns-prefetch" href="https://www.google.com" />
<link rel="dns-prefetch" href="https://www.gstatic.com" />

<link rel="search" href="{{ .origin }}/opensearch.xml" title="WeebDex" type="application/opensearchdescription+xml" />
<link rel="canonical" href="{{ .url }}" />

<meta name="application-name" content="{{ $name }}" />
<meta property="og:url" content="{{ .url }}" />

<meta name="twitter:url" content="{{ .url }}" />
<meta name="twitter:domain" content="{{ .host }}" />
<meta name="twitter:dnt" content="on" />

<meta property="og:type" content="website" />
<meta property="og:locale" content="en_GB" />

<meta property="og:site_name" content="{{ $name }}" />
<meta itemprop="name" content="{{ $name }}" />
<meta property="og:title" content="{{ $title }}" />
<meta property="og:image:alt" content="{{ $title }}" />

<meta name="twitter:title" content="{{ $title }}" />
<meta name="twitter:image:alt" content="{{ $title }}" />
<meta itemprop="description" content="{{ $description }}" />
<meta name="description" content="{{ $description }}" />
<meta property="og:description" content="{{ $description }}" />
<meta name="twitter:description" content="{{ $description }}" />

<meta itemprop="image" content="{{ .origin }}/images/monimonimoni.jpg" />
<meta property="og:image" content="{{ .origin }}/images/monimonimoni.jpg" />
<meta property="og:image:url" content="{{ .origin }}/images/monimonimoni.jpg" />
<meta property="og:image:secure_url" content="{{ .origin }}/images/monimonimoni.jpg" />

<meta name="twitter:image" content="{{ .origin }}/images/monimonimoni.jpg" />
<meta name="twitter:image:src" content="{{ .origin }}/images/monimonimoni.jpg" />
<meta name="twitter:card" content="summary_large_image" />
